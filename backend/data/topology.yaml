# GPU node -> rack edges are generated from each gpu_node's `rack` field.

# Incident presets for the "Trigger incident" button. `targets` limits which
# components the preset can be aimed at; the first one is the default.
incident_presets:
  - id: cooling_failure
    name: "Cooling failure"
    description: "Chiller trips on a compressor fault; CRACs lose chilled water and racks start heating."
    kinds: [chiller, crac]
    default_target: use-chiller-1
  - id: power_feed_loss
    name: "Power feed loss"
    description: "Utility feed drops; the generator fails to start, so the UPS runs on battery."
    kinds: [power_feed]
    default_target: usc-feed-a
  - id: tor_flapping
    name: "Top-of-rack switch flapping"
    description: "A ToR leaf's uplinks flap (bad optic); packet loss on every rack behind it."
    kinds: [leaf, spine]
    default_target: euw-leaf-a
  - id: storage_degradation
    name: "Storage degradation"
    description: "Two OSD disks fail; the cluster rebuilds with high latency and goes read-only in ~30 min if a third fails."
    kinds: [storage]
    default_target: use-stor-1
  - id: gpu_ecc
    name: "GPU ECC errors"
    description: "Correctable ECC errors spike on a GPU node; the GPU is likely to fall off the bus within ~20 min."
    kinds: [gpu_node]
    default_target: usc-gpu-c2
