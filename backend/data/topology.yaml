  - { id: northwind, name: "Northwind AI",      tier: platinum, sla: "99.95%", penalty_per_hour: 25000 }
  - { id: helios,    name: "Helios Robotics",   tier: gold,     sla: "99.9%",  penalty_per_hour: 8000 }
  - { id: lumen,     name: "Lumen Retail",      tier: gold,     sla: "99.9%",  penalty_per_hour: 6000 }
