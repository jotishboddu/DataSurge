# ---------------------------------------------------------------------------
# datasurge — simulated data center topology
#
# Edit this file to change the data center. The backend reloads it on reset.
#
#   components:   every physical/logical thing in the data center
#   dependencies: "to depends on from". `from` may be a list with `min`
#                 for redundant groups (e.g. dual-corded power: min 1 of 2).
#   workloads:    AI jobs. Their `host` (GPU node) and `storage` edges are
#                 generated automatically and change when workloads migrate.
#
# Edge types and how impact flows across them:
#   power       down->down, degraded->at_risk
#   cooling     loss of cooling puts dependents at risk (thermal model)
#   network     down->down, degraded->degraded
#   host        down->down, degraded->degraded
#   storage     training: down->down, inference: down->degraded
#   replication cross-region; source down -> replica at_risk (RPO)
#   failover    cross-region; primary down -> standby at_risk (load surge)
# ---------------------------------------------------------------------------

regions:
  - { id: us-east,    name: "US East (N. Virginia)", code: use }
  - { id: us-central, name: "US Central (Iowa)",     code: usc }
  - { id: eu-west,    name: "EU West (Dublin)",      code: euw }

# Round-trip latency between regions (ms) and cross-region egress price
region_latency_ms:
  us-east:    { us-east: 0,  us-central: 22, eu-west: 78 }
  us-central: { us-east: 22, us-central: 0,  eu-west: 95 }
  eu-west:    { us-east: 78, us-central: 95, eu-west: 0 }
egress_cost_per_gb: 0.02

customers:
